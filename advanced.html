<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Prep Generators</title>
<style>
  body { 
    font-family: Georgia, 'Times New Roman', serif; 
    padding: 20px; 
    background-color: #f4ecd8; 
    color: #000000;
  }
  .container { 
    max-width: 650px; 
    margin: auto; 
    background-color: #fcf9f2; 
    padding: 30px; 
    border-radius: 4px; 
    border: 1px solid #dcd1be;
    box-shadow: 2px 4px 10px rgba(0,0,0,0.1); 
  }
  .input-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    font-weight: bold;
    color: #5e1616;
    margin-bottom: 5px;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    font-family: Georgia, 'Times New Roman', serif;
    background-color: #f4ecd8;
    border: 1px solid #dcd1be;
    border-radius: 4px;
    box-sizing: border-box;
  }
  .generator-section {
    display: none; 
    padding: 15px;
    background-color: #e9eed5;
    border: 1px solid #dcd1be;
    border-radius: 4px;
    margin-bottom: 20px;
  }
  button { 
    display: block;
    width: 100%;
    padding: 15px; 
    font-size: 18px; 
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: bold;
    cursor: pointer; 
    background-color: #8a2525; 
    color: #f4ecd8; 
    border: 2px solid #5e1616; 
    border-radius: 6px; 
    margin-top: 20px;
    margin-bottom: 25px; 
    box-shadow: inset 0 0 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.2);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    transition: background-color 0.2s;
  }
  button:hover { 
    background-color: #701c1c; 
  }
  #results {
    margin-top: 20px;
  }
  .result-group { 
    display: flex;
    padding: 8px 12px; 
    border-bottom: 1px solid #e0d8c3;
  }
  .result-group:nth-child(even) {
    background-color: #e9eed5;
  }
  .category-name { 
    font-weight: bold; 
    color: #5e1616; 
    width: 160px; 
    flex-shrink: 0;
  }
  .category-value { 
    font-size: 1.05em; 
    color: #000000; 
  }
  .footer-text {
    text-align: center;
    font-size: 11px;
    opacity: 0.3;
    margin-top: 30px;
    font-family: sans-serif;
  }
</style>
</head>
<body>

<div class="container">
  <div class="input-group">
    <label for="masterSelect">Select Generator:</label>
    <select id="masterSelect">
      <option value="none">-- Choose a Generator --</option>
      <option value="faction">Random Faction</option>
      <option value="narrative">Narrative Hook & Backstory Weaver</option>
      <option value="npc">NPC Vocal Quirk & Mannerism Generator</option>
      <option value="horror">Unsettling Lore & Horror Encounter Builder</option>
      <option value="tavern">The Local Tavern Menu & Rumor Mill</option>
    </select>
  </div>

  <!-- Faction Inputs (None required, just a message) -->
  <div id="faction-inputs" class="generator-section">
    <div class="input-group" style="margin-bottom: 0;">
      <p style="color: #5e1616; font-style: italic; margin: 0;">No inputs required. Simply click generate below to roll on all 19 faction tables!</p>
    </div>
  </div>

  <!-- Narrative Inputs -->
  <div id="narrative-inputs" class="generator-section">
    <div class="input-group">
      <label for="charRace">Character Race:</label>
      <select id="charRace">
        <option>Dwarf</option><option>Elf</option><option>Human</option><option>Halfling</option><option>Tiefling</option>
      </select>
    </div>
    <div class="input-group">
      <label for="charClass">Character Class:</label>
      <select id="charClass">
        <option>Cleric</option><option>Fighter</option><option>Rogue</option><option>Wizard</option><option>Bard</option>
      </select>
    </div>
  </div>

  <!-- NPC Inputs -->
  <div id="npc-inputs" class="generator-section">
    <div class="input-group">
      <label for="npcProfession">NPC Profession (e.g., Blacksmith, Guard):</label>
      <input type="text" id="npcProfession" placeholder="Enter profession...">
    </div>
    <div class="input-group">
      <label for="npcMood">Current Mood:</label>
      <select id="npcMood">
        <option>Suspicious</option><option>Jovial</option><option>Exhausted</option><option>Terrified</option>
      </select>
    </div>
  </div>

  <!-- Horror Inputs -->
  <div id="horror-inputs" class="generator-section">
    <div class="input-group">
      <label for="horrorEnv">Environment:</label>
      <select id="horrorEnv">
        <option>Ancient Ruins</option><option>Deep Forest</option><option>Sewer System</option><option>Abandoned Village</option>
      </select>
    </div>
  </div>

  <!-- Tavern Inputs -->
  <div id="tavern-inputs" class="generator-section">
    <div class="input-group">
      <label for="tavernWealth">Tavern Wealth Level:</label>
      <select id="tavernWealth">
        <option>Poor</option><option>Modest</option><option>Affluent</option>
      </select>
    </div>
  </div>

  <button id="generateBtn" style="display:none;">Generate</button>
  <div id="results"></div>
  
  <div class="footer-text">powered by kows 2026</div>
</div>

    document.getElementById('results').innerHTML = '';
    
    if (this.value !== 'none') {
      document.getElementById(this.value + '-inputs').style.display = 'block';
      generateBtn.style.display = 'block';
      generateBtn.textContent = 'Generate ' + masterSelect.options[masterSelect.selectedIndex].text;

  function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  generateBtn.addEventListener('click', function() {
    const type = masterSelect.value;
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = ''; 

    let generatedData = {};

    if (type === 'faction') {
      // Loop through all 19 faction categories automatically
      for (const [category, options] of Object.entries(data.faction)) {
        generatedData[category] = getRandom(options);
      }
    }
    else if (type === 'narrative') {
      generatedData = {
        "Identity": document.getElementById('charRace').value + " " + document.getElementById('charClass').value,
        "Motivation": getRandom(data.narrative.motivations),
        "Dark Secret": getRandom(data.narrative.secrets),
        "Quirk": getRandom(data.narrative.quirks)
      };
    } 
    else if (type === 'npc') {
      const prof = document.getElementById('npcProfession').value || "Commoner";
      const mood = document.getElementById('npcMood').value;
      generatedData = {
        "Profile": mood + " " + prof,
        "Mannerism": getRandom(data.npc.mannerisms),
        "Vocal Quirk": getRandom(data.npc.vocal)
      };
    } 
    else if (type === 'horror') {
      generatedData = {
        "Location": document.getElementById('horrorEnv').value,
        "Sensory Detail": getRandom(data.horror.sensory),
        "Creepy Event": getRandom(data.horror.cues)
      };
    } 
    else if (type === 'tavern') {
      generatedData = {
        "Wealth": document.getElementById('tavernWealth').value,
        "Chef's Special": getRandom(data.tavern.food),
        "Local Beverage": getRandom(data.tavern.drinks),
        "Overheard Rumor": getRandom(data.tavern.rumors)
      };
    }

    // Render logic for whichever generator was chosen
    for (const [key, value] of Object.entries(generatedData)) {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'result-group';
      
      const nameSpan = document.createElement('span');
      nameSpan.className = 'category-name';
      nameSpan.textContent = key;
      
      const valueSpan = document.createElement('span');
      valueSpan.className = 'category-value';
      valueSpan.textContent = value;

      groupDiv.appendChild(nameSpan);
      groupDiv.appendChild(valueSpan);
      resultsDiv.appendChild(groupDiv);
    }
  });
</script>

</body>
</html>
