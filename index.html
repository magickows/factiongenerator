<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faction Generator</title>
<style>
  body { 
    /* Serif font and parchment background color */
    font-family: Georgia, 'Times New Roman', serif; 
    padding: 20px; 
    background-color: #f4ecd8; 
    color: #000000;
  }
  .container { 
    max-width: 650px; 
    margin: auto; 
    background-color: #fcf9f2; 
    padding: 30px; 
    border-radius: 4px; 
    border: 1px solid #dcd1be;
    box-shadow: 2px 4px 10px rgba(0,0,0,0.1); 
  }
  button { 
    display: block;
    width: 100%;
    padding: 15px; 
    font-size: 18px; 
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: bold;
    cursor: pointer; 
    /* Leather red styling */
    background-color: #8a2525; 
    color: #f4ecd8; 
    border: 2px solid #5e1616; 
    border-radius: 6px; 
    margin-bottom: 25px; 
    box-shadow: inset 0 0 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.2);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    transition: background-color 0.2s;
  }
  button:hover { 
    background-color: #701c1c; 
  }
  .result-group { 
    display: flex;
    padding: 8px 12px; 
    border-bottom: 1px solid #e0d8c3;
  }
  /* Alternating row colors matching the reference image */
  .result-group:nth-child(even) {
    background-color: #e9eed5;
  }
  .category-name { 
    font-weight: bold; 
    /* Maroon color for the headers */
    color: #5e1616; 
    width: 160px; 
    flex-shrink: 0;
  }
  .category-value { 
    font-size: 1.05em; 
    color: #000000; 
  }
  .footer-text {
    text-align: center;
    font-size: 11px;
    opacity: 0.3;
    margin-top: 30px;
    font-family: sans-serif;
  }
</style>
</head>
<body>

<div class="container">
  <button id="generateBtn">Generate Faction</button>
  <div id="results"></div>
  <div class="footer-text">Inspired by /u/Fruta-Puta-Tuta</div>

  };

  function generateRandomFaction() {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = ''; 

    for (const [category, options] of Object.entries(factionData)) {
      const randomIndex = Math.floor(Math.random() * options.length);
      const selectedOption = options[randomIndex];

      const groupDiv = document.createElement('div');
      groupDiv.className = 'result-group';
      
      const nameSpan = document.createElement('span');
      nameSpan.className = 'category-name';
      nameSpan.textContent = category; // Removed the colon for a cleaner look matching the image
      
      const valueSpan = document.createElement('span');
      valueSpan.className = 'category-value';
      valueSpan.textContent = selectedOption;

      groupDiv.appendChild(nameSpan);
      groupDiv.appendChild(valueSpan);
      resultsDiv.appendChild(groupDiv);
    }
  }

  document.getElementById('generateBtn').addEventListener('click', generateRandomFaction);
  
  // Generate the first one on load
  generateRandomFaction();
</script>

</body>
</html>
