<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>D&D Campaign Dashboard — Rebuilt</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-XQoYMqMTK8LpLeA6o2gJb6b4G2b6u9e2s9b1Kq1r1f1QxF6w5j6yZQmK7r1b4xg6" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    :root{--bg:#f4ecd8;--card:#fffdf7;--accent:#8a2525;--accent-dark:#701c1c;--muted:#7a7a7a}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{background:var(--bg);padding:18px;box-sizing:border-box;display:flex;align-items:stretch}
    .app{width:100%;max-width:1100px;margin:0 auto;display:flex;gap:18px}

    /* Sidebar */
    .sidebar{width:360px;background:var(--card);border:1px solid #e6dfc9;padding:18px;border-radius:8px;display:flex;flex-direction:column;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand h1{font-family:Georgia, serif;margin:0;font-size:1.15rem;color:var(--accent)}
    .small{font-size:0.9rem;color:var(--muted)}

    .panel{background:#ffffff;border:1px solid #efe7d3;padding:12px;border-radius:6px}
    .panel h2{margin:0 0 8px 0;color:var(--accent);font-size:1rem}

    /* Controls */
    .controls{display:flex;gap:8px;flex-wrap:wrap}
    .btn{background:var(--accent);color:white;padding:8px 12px;border-radius:6px;border:none;cursor:pointer}
    .btn.secondary{background:#333}

    /* Map area */
    .map-wrap{flex:1;display:flex;flex-direction:column;gap:8px}
    #map{height:720px;border-radius:8px;border:1px solid #e6dfc9}

    /* Notice board list */
    .list{display:flex;flex-direction:column;gap:6px}
    .list .item{padding:8px;border-radius:6px;border:1px dashed #efe7d3;background:#faf7ef;display:flex;justify-content:space-between}

    /* Loot history */
    .history{max-height:160px;overflow:auto;display:flex;flex-direction:column;gap:6px}

    /* Responsive */
    @media (max-width:980px){
      .app{flex-direction:column;padding:12px}
      .sidebar{width:100%}
      #map{height:480px}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='42' height='42' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%238a2525'/><text x='12' y='16' fill='%23fff' font-size='11' text-anchor='middle' font-family='Georgia'>D&amp;D</text></svg>" alt="logo" style="width:42px;height:42px;border-radius:6px;"/>
        <div>
          <h1>D&D Campaign Dashboard</h1>
          <div class="small">Modern rebuild — interactive map, loot, tension</div>
        </div>
      </div>

      <div class="panel">
        <h2>Search & Focus</h2>
        <input id="search" placeholder="Search region or rumor..." style="width:100%;padding:8px;border-radius:6px;border:1px solid #e6dfc9" />
        <div style="margin-top:8px;display:flex;gap:8px">
          <button class="btn" id="btn-fit">Fit All</button>
          <button class="btn secondary" id="btn-sketch">Toggle Sketch</button>
        </div>
      </div>

      <div class="panel">
        <h2>Notice Board</h2>
        <div class="list" id="notice-list"></div>
      </div>

      <div class="panel">
        <h2>Loot Reveal</h2>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div id="loot-text" style="font-weight:bold;font-size:1.05rem;min-height:36px">... awaiting discovery ...</div>
          <div style="display:flex;gap:8px"><button class="btn" id="btn-loot">Open Chest</button><button class="btn secondary" id="btn-clear-loot">Clear</button></div>
          <div class="history" id="loot-history"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Tension Tracker</h2>
        <div style="display:flex;align-items:center;gap:12px">
          <div style="flex:1;background:#fff;padding:6px;border-radius:6px;border:1px solid #efe7d3">
            <div id="tension-bar" style="height:14px;background:#eee;border-radius:6px;overflow:hidden"><div id="tension-fill" style="height:100%;width:0%;background:var(--accent)"></div></div>
          </div>
          <div style="min-width:48px;text-align:center;font-weight:bold" id="tension-val">0</div>
        </div>
        <div style="margin-top:8px;display:flex;gap:8px"><button class="btn" onclick="updateTension(-10)">-10</button><button class="btn" onclick="updateTension(20)">+20</button><button class="btn secondary" onclick="resetTension()">Reset</button></div>
      </div>

      <div class="small" style="margin-top:auto;opacity:0.6">Saved to localStorage — open in browser to run.</div>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div class="panel" id="info-panel"><h2>Region Info</h2><div id="info-content" class="small">Click a marker to view details.</div></div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // --- Data (migrated from original) ---
    const mapData = {
      'capital': { title: 'The High Capital', desc: 'The political heart of the realm. Magic use is monitored; the city guard is everywhere.', rumor: 'They say the King has not left his bedchambers in three weeks.' , coords: [51.505, -0.09]},
      'woods': { title: 'The Whispering Woods', desc: 'An ancient, dense forest where the veil with the Feywild is thin.', rumor: 'Travelers claim the trees rearrange themselves at night.' , coords: [51.49, -0.1]},
      'peaks': { title: 'Smoldering Peaks', desc: 'A volatile mountain range rich in rare ores.', rumor: 'A massive shadow has been seen circling the highest peak.' , coords: [51.52, -0.12]},
      'ruins': { title: 'The Sunken Ruins', desc: 'The remains of a coastal empire that fell into the sea centuries ago.', rumor: 'Fishermen report hearing singing coming from beneath the waves.' , coords: [51.5, -0.06]},
      'crossroads': { title: "Merchant's Crossroads", desc: 'A bustling hub where highways meet.', rumor: 'A black-market dealer known as "The Rook" is looking to buy artifacts.' , coords: [51.495, -0.083]}
    };

    const noticeItems = [
      {text:'Wanted: Goblins in the eastern woods.', reward:'50 GP'},
      {text:"Missing: The blacksmith's apprentice, last seen near the crypts.", reward:'100 GP'},
      {text:'Notice: The Magistrate has declared a curfew after sundown.', reward:'---'},
      {text:'Selling: Slightly cursed ring of jumping. No refunds.', reward:'20 GP'},
      {text:'Warning: Do not drink from the well in the lower district.', reward:'---'}
    ];

    const lootTable = [
      "Potion of Greater Healing","A rusty dagger with an unknown crest","10,000 iron nails",
      "Cloak of Elvenkind","A single, glowing blue coin","Wand of Magic Missiles",
      "A half-eaten apple that never rots","Scroll of Fireball","A wooden carved owl",
      "Boots of Striding and Springing","Bag of Holding (smells vaguely of cheese)",
      "A deed to a ruined tavern in the capital","+1 Longsword that glows faintly purple",
      "A sealed jar of pickled goblin eyes","Ring of Feather Falling",
      "A highly compromising love letter addressed to a local king","500 gold pieces in a velvet pouch",
      "A compass that only points to the nearest tavern","Potion of Invisibility",
      "A sentient, floating skull companion that complains constantly","Adamantine Chain Shirt",
      "A silver locket with a moving portrait inside","Boots of Elvenkind",
      "A heavily cursed, bone-carved flute","3 vials of potent Wyvern poison",
      "A clockwork sparrow that repeats the last sentence it heard","Robe of Useful Items",
      "An ancient map missing the northern half","A small meteorite that is always warm to the touch",
      "Helm of Telepathy"
    ];

    // --- Map setup ---
    const map = L.map('map', {zoomControl:true}).setView([51.505, -0.09], 13);
    const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution:'© OpenStreetMap contributors'}).addTo(map);
    const markers = L.markerClusterGroup();

    const markerIndex = {};

    Object.keys(mapData).forEach(key => {
      const d = mapData[key];
      const m = L.marker(d.coords, {title:d.title}).on('click', () => onMarkerClick(key));
      m.bindPopup(`<strong>${escapeHtml(d.title)}</strong><br/><em>${escapeHtml(d.rumor)}</em>`);
      markers.addLayer(m);
      markerIndex[key] = m;
    });

    map.addLayer(markers);

    function onMarkerClick(key){
      const d = mapData[key];
      const info = document.getElementById('info-content');
      info.innerHTML = `<strong>${escapeHtml(d.title)}</strong><p style=\"margin:8px 0 0 0;\"><strong>Lore:</strong> ${escapeHtml(d.desc)}</p><p style=\"margin:6px 0 0 0;\"><strong>Rumor:</strong> <em>"${escapeHtml(d.rumor)}"</em></p>`;
      // center map smoothly
      map.panTo(d.coords);
    }

    // Fit button
    document.getElementById('btn-fit').addEventListener('click', ()=>{map.fitBounds(markers.getBounds().pad(0.4))});

    // Search
    document.getElementById('search').addEventListener('input', (e)=>{
      const q = e.target.value.toLowerCase().trim();
      if(!q){markers.eachLayer(l=>l.getElement()?l.getElement().style.filter='':null);return}
      Object.keys(mapData).forEach(k=>{
        const d = mapData[k];
        const match = d.title.toLowerCase().includes(q) || d.rumor.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q);
        const m = markerIndex[k];
        if(m && m.getElement()) m.getElement().style.filter = match? '': 'grayscale(100%) opacity(0.45)';
      });
    });

    // --- Notice board render ---
    const noticeList = document.getElementById('notice-list');
    noticeItems.forEach(n => {
      const el = document.createElement('div'); el.className='item';
      el.innerHTML = `<div>${escapeHtml(n.text)}</div><div style=\"color:var(--muted)\">${escapeHtml(n.reward)}</div>`;
      noticeList.appendChild(el);
    });

    // --- Loot logic with persistence ---
    const lootText = document.getElementById('loot-text');
    const lootHistEl = document.getElementById('loot-history');
    let lootHistory = JSON.parse(localStorage.getItem('lootHistory')||'[]');
    renderLootHistory();

    document.getElementById('btn-loot').addEventListener('click', rollLoot);
    document.getElementById('btn-clear-loot').addEventListener('click', ()=>{lootHistory=[];localStorage.setItem('lootHistory',JSON.stringify(lootHistory));renderLootHistory();lootText.innerText='... awaiting discovery ...'});

    function rollLoot(){
      const seedCount = 20; let count=0; lootText.innerText='';
      const interval = setInterval(()=>{
        const item = lootTable[Math.floor(Math.random()*lootTable.length)]; lootText.innerText = item; count++;
        if(count>seedCount){clearInterval(interval); const final = lootTable[Math.floor(Math.random()*lootTable.length)]; lootText.innerText = final; lootHistory.unshift(final); if(lootHistory.length>50) lootHistory.length=50; localStorage.setItem('lootHistory',JSON.stringify(lootHistory)); renderLootHistory();}
      },60);
    }

    function renderLootHistory(){
      lootHistEl.innerHTML=''; if(lootHistory.length===0){lootHistEl.innerHTML='<div style="color:#888;font-style:italic">No loot discovered yet.</div>';return}
      lootHistory.forEach((it,i)=>{const row=document.createElement('div');row.className='item';row.style.borderStyle='solid';row.innerHTML=`<div><strong>Item ${i+1}:</strong> ${escapeHtml(it)}</div>`;lootHistEl.appendChild(row)});
    }

    // --- Tension tracker with persistence ---
    let currentTension = parseInt(localStorage.getItem('currentTension')||'0',10);
    const maxTension = 100;
    function renderTension(){
      const pct = Math.max(0,Math.min(100,currentTension));
      document.getElementById('tension-fill').style.width = pct + '%';
      document.getElementById('tension-val').innerText = pct;
      const title = document.getElementById('tension-val');
      if(pct>=80) title.style.color='var(--accent)'; else title.style.color='inherit';
      localStorage.setItem('currentTension',String(currentTension));
    }
    function updateTension(amount){ currentTension += amount; if(currentTension>maxTension) currentTension=maxTension; if(currentTension<0) currentTension=0; renderTension(); }
    function resetTension(){ currentTension=0; renderTension(); }
    renderTension();

    // --- Sketch toggle: show a procedural canvas overlay inside the map container ---
    let sketchVisible = false; let sketchCanvasEl=null;
    document.getElementById('btn-sketch').addEventListener('click', ()=>{
      sketchVisible = !sketchVisible;
      if(sketchVisible) showSketch(); else hideSketch();
    });

    function showSketch(){
      const container = document.getElementById('map');
      sketchCanvasEl = document.createElement('canvas');
      sketchCanvasEl.width = container.clientWidth; sketchCanvasEl.height = container.clientHeight;
      sketchCanvasEl.style.position='absolute'; sketchCanvasEl.style.top='0'; sketchCanvasEl.style.left='0'; sketchCanvasEl.style.zIndex=400; sketchCanvasEl.style.pointerEvents='none';
      sketchCanvasEl.id='sketch-canvas'; container.appendChild(sketchCanvasEl);
      generateSketchedMap(sketchCanvasEl.getContext('2d'), sketchCanvasEl.width, sketchCanvasEl.height);
    }
    function hideSketch(){ if(sketchCanvasEl && sketchCanvasEl.parentNode) sketchCanvasEl.parentNode.removeChild(sketchCanvasEl); sketchCanvasEl=null; }

    function generateSketchedMap(ctx, w, h){
      // mimic original procedural style but simplified and drawn to supplied context
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = '#f7f1e3'; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#4a3b32'; ctx.lineWidth = 1.2; ctx.fillStyle = '#ebdcc2';

      // coast blob
      ctx.beginPath(); const cx = w/2 + (Math.random()-0.5)*80; const cy = h/2 + (Math.random()-0.5)*20; const rX= Math.min(w*0.45,300); const rY = Math.min(h*0.35,160);
      for(let i=0;i<=18;i++){const a=(i/18)*Math.PI*2; const noise=(Math.random()-0.5)*35; const x = cx + Math.cos(a)*(rX+noise); const y = cy + Math.sin(a)*(rY+noise); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.closePath(); ctx.fill(); ctx.stroke();

      // mountains
      for(let m=0;m<6;m++){const mx = 80 + m*40 + (Math.random()-0.5)*16; const my=80 + (Math.random()-0.5)*24; ctx.beginPath(); ctx.moveTo(mx,my+20); ctx.lineTo(mx+18,my-18); ctx.lineTo(mx+36,my+20); ctx.closePath(); ctx.fill();}

      // forests
      for(let f=0; f<12; f++){const fx = w*0.6 + (Math.random()-0.5)*w*0.2; const fy = h*0.55 + (Math.random()-0.5)*h*0.2; ctx.beginPath(); ctx.arc(fx,fy,6,0,Math.PI*2); ctx.fill();}

      // river
      ctx.beginPath(); const rx = w*0.38; ctx.moveTo(rx,20); ctx.bezierCurveTo(rx+30,60,rx-30,140,rx+40,h-40); ctx.stroke();
    }

    // --- Utilities ---
    function escapeHtml(str){return String(str).replace(/[&<>"'`]/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[s]))}

    // --- Fit map on load ---
    setTimeout(()=>{map.fitBounds(markers.getBounds().pad(0.4))},300);

    // Expose functions for inline buttons
    window.updateTension = updateTension; window.resetTension = resetTension;

  </script>
</body>
</html>
